---
layout: default
---
<script src="{{ '/assets/js/distillpub/template.v2.js' | relative_url }}"></script>
<script src="{{ '/assets/js/distillpub/transforms.v2.js' | relative_url }}"></script>
<d-front-matter>
  <script type="text/json">{
    "title": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "published": "{{ page.date | date: '%B %-d, %Y' }}",
    "authors": [
      {% for author in page.authors %}
      {
        "author": {{ author.name | jsonify }},
        "authorURL": {{ author.url | jsonify }},
        "affiliations": [{"name": {{ author.affiliations.name | jsonify }}, "url": {{ author.affiliations.url | jsonify }}}]
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ],
    "katex": {"delimiters": [{"left": "$", "right": "$", "display": false}, {"left": "$$", "right": "$$", "display": true}]}
  }</script>
</d-front-matter>
<article class="post distill">
  <header class="post-header"><h1>{{ page.title }}</h1><p class="post-description">{{ page.description }}</p><p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p></header>
  <d-byline></d-byline>
  <d-article class="prose">{{ content }}</d-article>
  <d-appendix><d-footnote-list></d-footnote-list><d-citation-list></d-citation-list></d-appendix>
</article>
{% if page.bibliography %}<d-bibliography src="{{ page.bibliography | prepend: '/assets/bibliography/' | relative_url }}"></d-bibliography>{% endif %}
