---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
    {% if page.collection == 'projects' %}
    <div class="link-row"><a href="{{ '/projects/' | relative_url }}">&larr; All projects</a>{% if page.redirect %}<a href="{{ page.redirect }}">Open repository &nearr;</a>{% endif %}</div>
    {% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
