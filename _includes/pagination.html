{% if paginator.total_pages > 1 %}
<nav aria-label="Blog pagination">
  <ul class="pagination">
    <li>{% if paginator.previous_page %}<a href="{{ paginator.previous_page_path | relative_url }}">Newer</a>{% else %}<span class="disabled">Newer</span>{% endif %}</li>
    {% for trail in paginator.page_trail %}
    <li><a href="{{ trail.path | relative_url }}"{% if paginator.page == trail.num %} aria-current="page"{% endif %}>{{ trail.num }}</a></li>
    {% endfor %}
    <li>{% if paginator.next_page %}<a href="{{ paginator.next_page_path | relative_url }}">Older</a>{% else %}<span class="disabled">Older</span>{% endif %}</li>
  </ul>
</nav>
{% endif %}
