<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.url != "/" %}{{ page.title | default: site.blog_name | escape }} | {% endif %}{{ site.first_name }} {{ site.middle_name }} {{ site.last_name }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.first_name | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/notebook-mark.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}">
